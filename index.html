<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battaglia Navale Avanzata</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="screen-login" class="screen active">
        <h1>⚔️ Battaglia Navale</h1>
        <input type="text" id="input-nome" placeholder="Nome Giocatore..." maxlength="15">
        <button id="btn-unisciti">Entra in Battaglia</button>
    </div>

    <div id="screen-lobby" class="screen">
        <h2>⏳ Sala d'Attesa</h2>
        <ul id="lista-giocatori"></ul>
        <button id="btn-pronto" disabled>Pronti a posizionare le navi!</button>
    </div>

    <div id="screen-posizionamento" class="screen">
        <h2>🚢 Posiziona la tua Flotta</h2>
        <div class="pos-layout">
            <div class="navi-list" id="navi-da-posizionare">
                <!-- Popolato da JS -->
            </div>
            <div class="box-griglia">
                <div id="griglia-pos" class="griglia"></div>
            </div>
        </div>
        <div class="pos-controls">
            <button id="btn-ruota">Ruota (Orizzontale)</button>
            <button id="btn-conferma-pos" disabled>Conferma Flotta</button>
            <p id="pos-status" class="status-text"></p>
        </div>
    </div>

    <div id="screen-gioco" class="screen">
        <!-- PLAYER SELECTOR MODAL (MULTIPLAYER) -->
        <div id="modal-seleziona-bersaglio" class="modal hidden">
            <div class="modal-content">
                <h3>🎯 Scegli il tuo Bersaglio</h3>
                <div id="lista-bersagli" class="player-selector"></div>
                <button class="btn-close-modal">✕ Annulla</button>
            </div>
        </div>

        <div id="info-gioco">
            <div class="header-game">
                <div class="player-status">
                    <h2 id="nome-giocatore-attuale">Tu: Attendendo...</h2>
                    <p id="turno-attuale" class="turno-testo">Caricamento...</p>
                </div>
                <div class="turn-indicator">
                    <div id="turno-arrows" class="arrows-container"></div>
                </div>
            </div>
            <button id="btn-ricomincia" class="hidden">🔄 Ricomincia Partita</button>
        </div>

        <!-- POWER-UPS SECTION -->
        <div id="power-ups-section" class="power-ups-container hidden">
            <h4>⚡ Power-ups Disponibili</h4>
            <div id="power-ups-list" class="power-ups-list"></div>
        </div>

        <!-- SHIPS STATUS -->
        <div class="ships-status-bar">
            <div id="navi-rimaste" class="ships-display"></div>
        </div>

        <div class="container-griglie">
            <div class="box-griglia my-fleet">
                <h3>🔵 La tua Flotta</h3>
                <div id="griglia-personale" class="griglia"></div>
                <div id="flotta-status" class="fleet-status"></div>
            </div>
            <div class="box-griglia enemy-fleet">
                <h3 id="titolo-nemico">🔴 Bersaglio: <span id="nome-nemico">-</span></h3>
                <div id="griglia-nemica" class="griglia"></div>
                <button id="btn-cambia-bersaglio" class="btn-change-target hidden">Cambia Bersaglio ↔️</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
